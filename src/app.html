<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<script>
			// La dirección propia del proyecto de Pages lleva a vocal.quest (misma ruta), antes de cargar nada:
			// así hay un solo sitio para los buscadores, la sesión y los datos guardados. Las direcciones de los
			// deploys de prueba (<id>.singmaker.pages.dev) siguen funcionando.
			if (location.hostname === 'singmaker.pages.dev')
				location.replace(
					'https://vocal.quest' + location.pathname + location.search + location.hash
				);
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#f4f6fb" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Vocal Quest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Bricolage+Grotesque:wght@400..800&display=swap"
		/>
		<title>Vocal Quest</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
